name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kosovota
      SESSION_SECRET: ci-only-session-secret-not-for-production
      NEXT_PUBLIC_MAP_PROVIDER: osm
      GEOCODING_PROVIDER: maptiler
      NOTIFICATION_DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
